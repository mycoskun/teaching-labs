<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ME 3001 One Block</title>
<meta name="description" content="A block-diagram reduction game for ME 3001 / GMM 3003 Lecture 4: reduce each diagram to a single block with the rules of the lecture notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
[hidden]{display:none!important}
/* Course design system shared with the L01 Feedback Lab and L03 Model Lab: navy ink, one orange accent,
   IBM Plex. Layout: header, then the level map, the rule reference or the play view
   (diagram + rule dock on the left, task / short names / response on the right). */
:root{
  --ground:#F3F5F8; --surface:#FFFFFF; --surface2:#E9EDF3; --line:#D3D9E2;
  --ink:#1B2533; --ink2:#4A5568; --muted:#7A8599;
  --navy:#14213D; --accent:#E8590C; --accent-soft:#FFF1E8;
  --wire:#2E3A4F; --sel:#E8590C; --sel-soft:#FFE6D5; --fresh:#2A78D6;
  --ok:#1E7A3A; --ok-bg:#E6F4EA; --warn-bg:#FDECEC; --warn-bar:#C92A2A; --ask-bg:#FFF7E0; --ask-bar:#C98500;
  --c-base:#2A78D6; --c-alt:#C92A2A; --grid:#E3E7EC; --star:#E8A20C;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --cond:"IBM Plex Sans Condensed","Segoe UI Semibold","Arial Narrow",sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --math:"Cambria Math","STIX Two Math","Latin Modern Math",math,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1422; --surface:#151F33; --surface2:#1D2A42; --line:#2C3A55;
    --ink:#E6EBF3; --ink2:#B4BFD0; --muted:#8793A8;
    --navy:#9FB3D1; --accent:#FF7A33; --accent-soft:#3A2416;
    --wire:#B4BFD0; --sel:#FF8A4C; --sel-soft:#3A2416; --fresh:#5B9DF0;
    --ok:#4CC26E; --ok-bg:#163020; --warn-bg:#3A1A1C; --warn-bar:#FF6B6A; --ask-bg:#33290F; --ask-bar:#E5AE3A;
    --c-base:#4C8FE6; --c-alt:#F05A58; --grid:#223049; --star:#F2B632;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1422; --surface:#151F33; --surface2:#1D2A42; --line:#2C3A55;
  --ink:#E6EBF3; --ink2:#B4BFD0; --muted:#8793A8;
  --navy:#9FB3D1; --accent:#FF7A33; --accent-soft:#3A2416;
  --wire:#B4BFD0; --sel:#FF8A4C; --sel-soft:#3A2416; --fresh:#5B9DF0;
  --ok:#4CC26E; --ok-bg:#163020; --warn-bg:#3A1A1C; --warn-bar:#FF6B6A; --ask-bg:#33290F; --ask-bar:#E5AE3A;
  --c-base:#4C8FE6; --c-alt:#F05A58; --grid:#223049; --star:#F2B632;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0}
math{font-family:var(--math);math-style:normal}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:2px solid var(--navy);padding-bottom:12px}
.brand{min-width:0}
.course{font-family:var(--cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--cond);font-weight:600;font-size:clamp(30px,4.4vw,44px);line-height:1.05;margin:2px 0 0;color:var(--navy);text-wrap:balance}
.lede{color:var(--ink2);max-width:62ch;margin:6px 0 0}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.views{display:flex;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:600 13px/1 var(--sans);padding:9px 11px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--ground)}
.btn{font:600 14px/1.2 var(--sans);border-radius:6px;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:var(--ground)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pulse{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{margin-top:18px}
.map-intro{color:var(--ink2);max-width:72ch;margin:0 0 16px}

/* level map */
.chapters{display:grid;gap:18px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.chap-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:10px}
.chap-head h2{font-family:var(--cond);font-weight:600;font-size:22px;margin:0;color:var(--navy)}
.chap-head h2 b{color:var(--accent);font-family:var(--mono);font-size:16px;margin-right:8px}
.chap-src{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:9px 11px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .tid{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tile .tname{font-weight:600;font-size:14.5px;line-height:1.3}
.stars{color:var(--star);letter-spacing:1px;font-size:14px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}

/* rule reference */
.rule-ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rref{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rref h3{margin:0;font-family:var(--cond);font-size:19px;color:var(--navy);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rref h3 b{font-family:var(--mono);font-size:14px;color:var(--accent)}
.rref .ico{color:var(--ink2);width:112px;height:66px}
.rref .ico svg{width:100%;height:100%}
.rref p{margin:0;color:var(--ink2);font-size:14.5px}
.rref .formula{font-size:18px}
.badge{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:3px 5px}

/* play */
.levelbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.lv-id{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--ground);background:var(--navy);border-radius:5px;padding:4px 9px}
.lv-text{min-width:0;flex:1 1 260px}
.lv-text h2{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.1;margin:0;color:var(--navy);text-wrap:balance}
.lv-src{font-size:13px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:13.5px;padding:4px 9px;border-radius:5px;background:var(--surface2);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:600}
.chip.warn{background:var(--warn-bg)}
.play{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:920px){.play{grid-template-columns:minmax(0,1fr)}}
.col-main,.col-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.dcard{padding:8px 8px 6px}
.dscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.dscroll.overflow{box-shadow:inset -14px 0 12px -12px rgba(0,0,0,.35)}
.dsizer{position:relative;margin:0 auto}
.diagram{position:absolute;left:0;top:0;transform-origin:0 0}
.diagram svg{display:block;overflow:visible}
.msg{margin:6px 6px 2px;min-height:1.5em;font-size:15px;color:var(--ink2)}
.msg.warn{color:var(--warn-bar)}
.msg.good{color:var(--ok)}

/* diagram drawing */
.dg .w{stroke:var(--wire);stroke-width:1.6;fill:none}
.dg .ah{fill:var(--wire)}
.dg .blk{fill:var(--surface);stroke:var(--wire);stroke-width:1.6}
.dg .sum{fill:var(--surface);stroke:var(--wire);stroke-width:1.6}
.dg .tap{fill:var(--wire)}
.dg .sgn{font:600 14px var(--sans);fill:var(--ink)}
.dg .io{font:italic 15px Cambria,Georgia,serif;fill:var(--ink)}
.dg .hit{stroke:transparent;stroke-width:18;fill:none;cursor:pointer;pointer-events:stroke}
.dg [data-b],.dg [data-p]{cursor:pointer}
.dg .pth.sel .w{stroke:var(--sel);stroke-width:2.6}
.dg .pth.sel .ah{fill:var(--sel)}
.dg .pth.focus .ah{fill:var(--sel)}
.dg .pth.sel .blk,.dg .mb.sel .blk,.dg .sg.sel .sum{stroke:var(--sel);stroke-width:2.6;fill:var(--sel-soft)}
.dg .pth.focus .w{stroke:var(--sel);stroke-dasharray:5 4}
.dg .mb.focus .blk,.dg .sg.focus .sum,.dg .pth.focus .blk{stroke:var(--sel);stroke-dasharray:5 4}
.dg .mb.fresh .blk,.dg .pth.fresh .blk{animation:fresh 1.1s ease-out}
.dg .pth.fresh .w{animation:freshw 1.1s ease-out}
@keyframes freshw{0%{stroke:var(--fresh);stroke-width:3.2}100%{}}
@keyframes fresh{0%{fill:var(--fresh);stroke:var(--fresh)}100%{}}
.dg .mb:hover .blk,.dg .sg:hover .sum,.dg .pth:hover .w,.dg .pth:hover .blk{stroke:var(--accent)}
.dg .pth:hover .ah{fill:var(--accent)}
.dg .hitc{fill:transparent;stroke:none}
.dg g:focus{outline:none}
.dg g:focus-visible .blk,.dg g:focus-visible .sum{stroke:var(--accent);stroke-width:3}
.dg .pth:focus-visible .w{stroke:var(--accent);stroke-width:3}
.lab{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:17px;line-height:1.1;white-space:nowrap;color:var(--ink)}
.lab math{font-size:17px}
.measure{position:absolute;left:-9999px;top:0;visibility:hidden;font-size:17px;line-height:1.1;white-space:nowrap}
.measure span{display:inline-block}
.measure math{font-size:17px}

/* dock: rule cards, question, result */
.dock{padding:12px}
.dock h3,.side h3{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rcard{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:2px 8px;text-align:left;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:8px 9px;cursor:pointer;min-height:58px}
.rcard:hover:not(:disabled){border-color:var(--accent)}
.rcard svg{grid-row:span 2;width:44px;height:26px;color:var(--ink2)}
.rcard .rn{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.1;display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px}
.rcard .rt{font-weight:600;font-size:14px;line-height:1.2}
.rcard .rn em{font:600 9.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 3px;white-space:nowrap}
.rcard:disabled{opacity:.38;cursor:not-allowed}
.rcard.pulse{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rcard.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.q-rule{font-family:var(--cond);font-weight:600;font-size:18px;color:var(--navy)}
.q-prompt{margin:0 0 8px;font-weight:600}
.q-ops{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--ink2);font-size:15px}
.q-ops span{display:inline-flex;align-items:center;gap:6px}
.q-ops math{font-size:17px}
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.q-opts.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.opt{position:relative;font:inherit;color:var(--ink);background:var(--surface2);border:2px solid transparent;border-radius:6px;padding:16px 10px 12px;cursor:pointer;min-height:64px;display:flex;align-items:center;justify-content:flex-start;overflow-x:auto}
.opt > math{margin-inline:auto}
.opt .letter{position:absolute;left:7px;top:5px;font:600 12px/1 var(--mono);color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt:disabled{cursor:default}
.opt .vbar{position:absolute;left:0;bottom:0;height:6px;background:var(--accent);border-radius:0 3px 0 0}
.opt .vnum{position:absolute;right:7px;top:5px;font:600 12px/1 var(--mono);color:var(--ink2)}
.dg-opts{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dg-opts .opt{display:block;padding:22px 8px 10px}
.opt math{font-size:19px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.wrong{border-color:var(--warn-bar);background:var(--warn-bg);cursor:default}
.q-fb{margin:10px 0 0;min-height:1.4em;font-size:15px}
.q-fb.warn{color:var(--warn-bar)}
.typed{display:flex;flex-direction:column;gap:8px}
.typed-row{display:flex;gap:8px;flex-wrap:wrap}
.typed input{flex:1 1 220px;min-width:0;font:15px var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.preview{min-height:52px;padding:8px 10px;border-radius:6px;background:var(--surface2);overflow-x:auto;display:flex;align-items:center}
.preview math{font-size:19px}
.preview .err{color:var(--warn-bar);font-size:14px}
.keypad{display:flex;flex-wrap:wrap;gap:5px}
.keypad button{font:600 14px/1 var(--mono);min-width:40px;padding:9px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);cursor:pointer}
.keypad button.sym{background:var(--accent-soft)}
.hint-ex{font-size:13px;color:var(--muted)}
.done{display:flex;flex-direction:column;gap:10px}
.done p{margin:0}
.done .big-stars{font-size:34px;color:var(--star);letter-spacing:4px;line-height:1}
.done .big-stars i{font-style:normal;color:var(--line)}
.result{background:var(--surface2);border-radius:6px;padding:10px 12px;overflow-x:auto}
.result math{font-size:20px}
.result small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.note{background:var(--ask-bg);border-left:3px solid var(--ask-bar);padding:8px 12px;border-radius:0 6px 6px 0;margin:0;font-size:14.5px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mode{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2)}
.mode select{font:14px var(--sans);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.side{padding:12px 14px}
.side p{margin:0;color:var(--ink);font-size:15px}
.legend-list{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.legend-list .alias{font-size:16px}
.legend-list .empty{color:var(--muted);font-size:14px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--ink2);stroke-width:1}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .tk{font:11px var(--mono);fill:var(--muted)}
.chart .base{stroke:var(--c-base);stroke-width:2.2;fill:none}
.chart .alt{stroke:var(--c-alt);stroke-width:2;fill:none;stroke-dasharray:6 4}
.chart .lg{font:12px var(--sans);fill:var(--ink2)}
.chart{position:relative}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .dot-b{fill:var(--c-base);stroke:var(--surface);stroke-width:2}
.chart .dot-a{fill:var(--c-alt);stroke:var(--surface);stroke-width:2}
.chart .sw-b{stroke:var(--c-base);stroke-width:2.2}
.chart .sw-a{stroke:var(--c-alt);stroke-width:2;stroke-dasharray:6 4}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font:12px/1.35 var(--mono);color:var(--ink);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chart-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:4px}
.chart-lg span{display:inline-flex;align-items:center;gap:6px}
.chart-lg svg{width:22px;height:8px}
.chart-note{font-size:13px;color:var(--muted);margin:4px 0 0}
.samples summary{cursor:pointer;font-size:13px;color:var(--ink2);margin-top:6px}
.samples div{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:15px}
.q-fb.good{color:var(--ok)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.kbd-help{font-size:12.5px;color:var(--muted);margin:0}
@media (hover:none){.kbd-help{display:none}}

/* small diagrams: answer options, the figure in the task card */
.mini{position:relative;width:100%;overflow:hidden}
.mini-in{position:absolute;left:0;top:0;transform-origin:0 0}
.mini .dg [data-b],.mini .dg [data-p]{cursor:inherit}
.figbox{margin-top:10px}
.figcap{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.dcap{font-size:13px;color:var(--muted);margin:2px 6px 0}
.dcap:empty{display:none}

/* class vote */
.vote{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.vote-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.vote-head b{font-family:var(--cond);font-size:17px;color:var(--navy);margin-right:auto}
.timer{font:600 20px/1 var(--mono);min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.timer.up{color:var(--warn-bar)}
.vote select{font:14px var(--sans);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px}
.tl{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono)}
.tl b{font-size:16px}
.tb{font:600 17px/1 var(--mono);width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.tn{min-width:2ch;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.vote-help{margin:0;font-size:13.5px;color:var(--muted)}
.vfb{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--ink2)}
.vfb b{font-family:var(--mono);margin-right:8px;color:var(--warn-bar)}

/* solution replay and notebook */
.seg.sol-src{margin-left:auto}
.res-line{margin:0 0 8px;font-size:15.5px}
.res-line math{font-size:18px}
.replay-nav{margin-top:6px}
.sol-row{align-items:center}
.sol-row .lbl{font-size:14px;color:var(--ink2)}
.notebook{background:var(--surface2);border-radius:6px;padding:8px 12px}
.notebook summary{cursor:pointer;font-weight:600}
.notebook ol{margin:8px 0;padding-left:22px;display:flex;flex-direction:column;gap:5px;font-size:14.5px;overflow-x:auto}
.notebook li math{font-size:16px}
.nb-text{width:100%;font:12.5px/1.4 var(--mono);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink);resize:vertical;margin-top:8px}
.nb-msg{font-size:13.5px;color:var(--ink2);align-self:center}
@media print{
  body.print-nb *{visibility:hidden}
  body.print-nb .notebook,body.print-nb .notebook *{visibility:visible}

  for (const e of st0.els) if (e.t === "b") ol = pmul(ol, ptrim(evalE(e.g, RF, S_ENV, []).d));
  for (const p of Object.values(st0.paths)) ol = pmul(ol, ptrim(evalE(p.g, RF, S_ENV, []).d));

  try { const rf = reduceToGain(flipFeedback(st0)); if (rf) TF = evalE(rf.g, RF, S_ENV, rf.aliases); } catch (err) { TF = null; }

    questions: [{ kind: "nc", eq0: true, opts: charQ }, { kind: "np", opts: polesQ }, { kind: "nf", opts: finQ }] };

function fnv(s) {

/* ---------- game state ---------- */
const G = { L: null };

const inpName = () => (G.L && G.L.inp) || "R";

/* A drawing-only diagram: "X:N" on the main line is an external input N entering a summing point. */
const figState = spec => OB.parseFig(spec);

/* stage: "pre" (questions before the reduction), "play", "post" (questions after it), "quiz" (a level
   made of questions only) or "rq" (which rules apply, no reduction) */
function startLevel(id, lv) {
  const L = lv || LEVELS[levelIndex(id)];
  stopReplay(); stopTimer();
  Object.assign(G, {
    L: L, st0: null, st: null, hist: [], moves: 0, mistakes: 0, hintUsed: false, hintStep: 0, sel: [], q: null, done: false,
    fresh: new Set(), plan: null, par: 0, stuck: false, syms: [], alt: null, altNote: "", msg: "", msgCls: "", stars: 0,
    log: [], deckPos: L.deck ? 0 : -1, deckHist: [], replay: null, vote: null, quiz: null, qi: 0,
    stage: L.rqData ? "rq" : L.quiz ? "quiz" : L.pre ? "pre" : "play", rm: null, base: null
  });
  G.fig = L.fig ? figState(L.fig) : null;
  if (L.rqData) { G.st = L.rqData.st; G.rqs = { picked: new Set(), checked: false, right: false, show: "" }; }
  if (L.main) {
    const st0 = OB.parseLevel(L), sol = OB.solve(st0, L.allowed);
    const syms = new Set();
    for (const e of st0.els) if (e.t === "b") OB.symbolsOf(e.g, [], syms);
    for (const p of Object.values(st0.paths)) OB.symbolsOf(p.g, [], syms);
    if (L.numeric) syms.add("s");
    Object.assign(G, { st0: st0, st: st0, plan: sol, par: sol ? sol.cost : 0, stuck: !sol, syms: Array.from(syms).sort(symOrder) });
    G.envs = OB.randomEnvs(G.syms, 4, 4711);
    if (sol) {
      const end = OB.runPlan(st0, sol.plan);
      G.rm = OB.responseModel(st0, end.els[0].g, end.aliases, 11);
      if (G.rm) G.base = OB.stepResponse(G.rm.T, G.rm.tEnd);
    }
  }
  if (G.stage !== "play" && G.stage !== "rq") newQuizQ();
  renderPlay();
}

/* selection: up to two items, {k: "b"|"p", id} */
const selBlocks = () => G.sel.filter(x => x.k === "b").map(x => x.id);

function toggleSel(k, id) {
  if (G.q || G.done || G.replay || G.stage !== "play") return;
  const i = G.sel.findIndex(x => x.k === k && x.id === id);
  if (i >= 0) G.sel.splice(i, 1);
  else { G.sel.push({ k: k, id: id }); if (G.sel.length > 2) G.sel.shift(); }
  setMsg("", "");
  updateMarks();
}

function setMsg(text, cls) { G.msg = text; G.msgCls = cls || ""; const m = $("msg"); m.textContent = text; m.className = "msg" + (cls ? " " + cls : ""); }

function onRule(r) {
  if (G.q || G.done || G.replay || G.stage !== "play") return;
  if (!G.sel.length) { setMsg(t("selNone"), "warn"); return; }
  const sel = { blocks: selBlocks(), paths: selPaths() };
  const res = OB.analyze(G.st, r, sel);
  if (!res.ok) {
    if (!/^sel_/.test(res.why)) { G.mistakes++; renderStats(); }
    setMsg((WHY[prefs.lang][res.why] || res.why), "warn");
    const c = document.querySelector('.rcard[data-r="' + r + '"]');
    if (c) { c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
    return;
  }
  const app = { rule: r, sel: sel };
  if (res.kind === "none") { commit(res.apply(), t("swapped", { cr: crText() }), { app: app, res: res }); return; }
  G.q = {
    res: res, app: app, opts: OB.prepareOptions(G.st, res, 17 + G.moves * 31 + levelIndex(G.L.id)),
    wrong: new Set(), tries: 0, forceMcq: false, text: "", fb: "", fbCls: ""
  };
  G.alt = null; G.altNote = ""; G.vote = null; resetTimer();
  setMsg("", "");
  renderDock(); updateMarks(); drawChart();
}

/* info = {app, res}: the move, kept for the solution notebook and for following the notes' way */
function commit(next, text, info) {
  const prev = G.st;
  G.hist.push(prev);
  G.deckHist.push(G.deckPos);
  G.log.push({ rule: info.app.rule, res: info.res, st: prev, next: next });
  if (G.deckPos >= 0) {
    const step = G.L.deck[G.deckPos], want = step ? OB.deckApp(prev, step) : null;
    G.deckPos = want && sameApp(want, info.app) ? G.deckPos + 1 : -1;
  }
  stopTimer(); G.vote = null;
  G.st = next; G.moves++; G.sel = []; G.q = null; G.hintStep = 0; G.alt = null; G.altNote = "";
  G.fresh = freshIds(prev, next);
  afterChange(text, "good");
}
function sameApp(a, b) {
  if (a.rule !== b.rule) return false;
  const eq = (x, y) => x.length === y.length && x.every(v => y.includes(v));
  return a.rule === "K2" ? eq(a.sel.blocks, b.sel.blocks) : eq(a.sel.paths, b.sel.paths);

  const old = new Set(prev.els.map(e => e.id)), out = new Set();
  for (const e of next.els) if (!old.has(e.id)) out.add("b:" + e.id);
  for (const [k, p] of Object.entries(next.paths)) if (prev.paths[k] && OB.key(prev.paths[k].g) !== OB.key(p.g)) out.add("p:" + k);

function afterChange(text, cls) {
  const goal = OB.isGoal(G.st);
  G.plan = goal ? { cost: 0, plan: [] } : OB.solve(G.st, G.L.allowed);
  G.stuck = !G.plan;
  G.done = goal && !G.L.post;
  if (goal && G.L.post) { G.stage = "post"; G.qi = 0; newQuizQ(); }
  if (G.done) finish();
  renderPlay();
  if (G.stuck) setMsg(t("stuck"), "warn");

}
function undo() {

  if (!G.hist.length) return;
  G.st = G.hist.pop(); G.moves--; G.sel = []; G.hintStep = 0; G.fresh = new Set(); G.alt = null; G.altNote = "";
  G.log.pop();
  if (G.deckHist.length) G.deckPos = G.deckHist.pop();

function closeQ() { G.q = null; G.alt = null; G.altNote = ""; G.vote = null; stopTimer(); renderDock(); updateMarks(); drawChart(); }

/* While the player is still on the notes' way, the hint gives the notes' next step. */
function nextHintApp() {
  if (G.deckPos >= 0 && G.deckPos < G.L.deck.length) {
    const step = G.L.deck[G.deckPos], app = OB.deckApp(G.st, step);
    if (app) return { app: app, slide: step[2] };
  }
  return G.plan && G.plan.plan.length ? { app: G.plan.plan[0] } : null;
}
function hint() {
  if (G.done || G.q || G.replay || G.stage !== "play") return;
  const h = G.stuck ? null : nextHintApp();
  if (!h) { setMsg(t("stuck"), "warn"); return; }
  const app = h.app;
  G.hintUsed = true;
  if (G.hintStep === 0) {
    G.hintStep = 1;
    setMsg(h.slide ? t("hintDeck", { s: h.slide, rule: ruleLabel(app.rule) }) : t("hint1", { rule: ruleLabel(app.rule) }), "");
  } else {
    G.sel = (app.sel.blocks || []).map(id => ({ k: "b", id: id })).concat((app.sel.paths || []).map(id => ({ k: "p", id: id })));
    setMsg(t("hint2"), "");
    updateMarks();
  }
  renderStats();
  document.querySelectorAll(".rcard").forEach(c => c.classList.toggle("pulse", c.dataset.r === app.rule));
}

function finish() {
  const L = G.L;
  let s = !L.main ? (G.mistakes === 0 ? 3 : G.mistakes <= 2 ? 2 : 1)
    : (G.moves <= G.par && G.mistakes === 0) ? 3 : (G.moves <= G.par + 2 && G.mistakes <= 2) ? 2 : 1;
  if (G.hintUsed) s = Math.min(s, 2);
  G.stars = s;
  if (!L.practice && !(prefs.best[L.id] >= s)) { prefs.best[L.id] = s; savePrefs(); }
}

/* ---------- answering ---------- */
function answerMode() {
  if (G.q && G.q.forceMcq) return "mcq";
  if (prefs.mode !== "auto") return prefs.mode;
  if (G.L.practice) return G.L.practice === "e" ? "mcq" : "typed";
  return G.L.ch <= 4 || G.L.ch === 7 ? "mcq" : "typed";
}
const tagText = (o, res) => TAG[prefs.lang][o.tag === "mv_inv" ? "mv_inv_" + res.rule : o.tag] || t("wrongGeneric");
function pickOption(i) {
  const q = G.q, o = q.opts[i];
  if (!o || q.wrong.has(i) || (G.vote && G.vote.shown)) return;
  if (o.tag === "ok") { commit(q.res.apply(q.res.correct), t("correct", { cr: crText() }), { app: q.app, res: q.res }); return; }
  G.mistakes++;
  q.wrong.add(i);
  q.fb = tagText(o, q.res); q.fbCls = "warn";
  showAlt(o.e);
  renderStats(); renderDock();
}
function parseTyped(text) {
  try {
    const e = OB.parse(text, { symbols: new Set(G.syms), aliasCount: G.st.aliases.length });
    return { e: e };
  } catch (err) {
    if (err && err.code) return { err: t("err_" + err.code, { ch: esc(err.ch || ""), sym: esc(err.sym || ""), tok: esc(err.tok || "") }) };
    return { err: t("err_zero") };
  }
}
function checkTyped() {
  const q = G.q, text = q.text.trim();
  if (!text) return;
  const r = parseTyped(text);
  if (r.err) { q.fb = r.err; q.fbCls = "warn"; renderFb(); return; }
  if (OB.sameValue(r.e, q.res.correct, G.envs, G.st.aliases)) { commit(q.res.apply(q.res.correct), t("correct", { cr: crText() }), { app: q.app, res: q.res }); return; }
  G.mistakes++; q.tries++;
  let fb = null;
  for (const o of q.opts) {
    if (o.tag === "ok") continue;
    if (OB.sameValue(r.e, o.e, G.envs, G.st.aliases)) { fb = tagText(o, q.res); break; }
  }
  /* no known misconception: say which part is wrong, if only one is */
  if (!fb) {
    const c = OB.compareParts(r.e, q.res.correct, G.envs, G.st.aliases);
    if (c.kind === "scale") fb = Math.abs(c.k + 1) < 1e-7 ? t("part_sign") : Math.abs(c.k - 1) < 1e-3 ? t("part_round") : t("part_scale", { k: OB.numText(c.k) });

    else if (c.kind === "den") fb = t("part_den");

function showAlt(e) {
  G.alt = null; G.altNote = "";

  try {
    const red = OB.reduceToGain(G.q.res.apply(e));
    if (!red) return;
    const T = OB.evalE(red.g, OB.RF, G.rm.env, red.aliases);
    const nd = OB.ptrim(T.n).length, dd = OB.ptrim(T.d).length;
    if (nd > dd) { G.altNote = t("altImproper"); }
    else {
      const sr = OB.stepResponse(T, G.rm.tEnd);
      const unstable = OB.ratPoles(T).some(p => p.re >= -1e-6);
      if (sr) { G.alt = sr; G.altNote = t("altSee", { cr: crText() }) + (unstable || sr.diverged ? " " + t("altUnstable") : ""); }
    }

/* ---------- diagram layout ---------- */

  for (const p of Object.values(st.paths)) if (!isOne(p.g)) items.push(["p:" + p.id, p.g]);
  const box = $("measure");
  box.innerHTML = items.map(([k, g]) => '<span data-m="' + k + '">' + mathOf(st, g) + "</span>").join("");
  const size = {};
  for (const el of box.children) {
    const r = el.getBoundingClientRect();
    size[el.dataset.m] = { w: Math.max(MIN_BW, Math.ceil(r.width) + 2 * BPAD), h: Math.max(MIN_BH, Math.ceil(r.height) + 14) };
  }
  box.innerHTML = "";
  return size;
}
function layout(st, size) {
  const els = st.els, n = els.length;

    const w = OB.wireOf(st, p.tap), s = OB.sumIdx(st, p.id), fb = w > s;
    return { id: p.id, p: p, w: w, s: s, fb: fb, lo: fb ? s : w - 0.5, hi: fb ? w - 0.5 : s, unity: isOne(p.g), lane: 1 };
  });

    const list = P.filter(q => q.fb === side).sort((a, b) => (a.hi - a.lo) - (b.hi - b.lo));
    const placed = [];
    for (const q of list) {

      placed.push(q);

  for (const tl of taps) tl.sort((a, b) => (a.fb - b.fb) || (a.fb ? a.lane - b.lane : b.lane - a.lane));
  const pre = new Array(n + 1).fill(0), post = new Array(n + 1).fill(0);

      xs[k] = x;

      taps[k].forEach((q, i) => { tapX[q.id] = x + TAP0 + pre[k] + i * TAP_GAP; last = tapX[q.id]; });
      x = last + WIRE + post[k];
      xe[k] = x;
      if (k < n) { cx[k] = x + bw(els[k]) / 2; x += bw(els[k]); }

      const have = Math.abs(g.tapX[q.id] - g.cx[q.s]);
      if (have < need - 0.5) { if (q.fb) pre[q.w] += need - have; else post[q.w] += need - have; changed = true; }

  let top = up ? dy(up) + pathH / 2 : mainH / 2 + 18;

  if (els.some(e => e.t === "x")) top = Math.max(top, mainH / 2 + 62);

    }
    obs.sort((a, b) => a - b);
    let bx = (lo + hi) / 2, gap = -1;
    for (let i = 0; i + 1 < obs.length; i++) if (obs[i + 1] - obs[i] > gap) { gap = obs[i + 1] - obs[i]; bx = (obs[i] + obs[i + 1]) / 2; }
    q.bx = bx; q.bw = size["p:" + q.id].w; q.bh = size["p:" + q.id].h;
  }

}

function arrow(x, y, dir) {
  const L = 8, w = 4.5;
  const pts = { r: [[x, y], [x - L, y - w], [x - L, y + w]], l: [[x, y], [x + L, y - w], [x + L, y + w]], u: [[x, y], [x - w, y + L], [x + w, y + L]], d: [[x, y], [x - w, y - L], [x + w, y - L]] }[dir];

}
const pl = pts => '<polyline class="w" points="' + pts.map(p => p.join(",")).join(" ") + '"/>';

/* The diagram as SVG plus HTML labels. o.live adds the selection hooks, o.fresh marks new elements,
   o.inp / o.out name the input and output. */
function diagramHtml(st, o) {
  const size = measure(st), Lg = layout(st, size), fresh = o.fresh || new Set();
  const y = Lg.y0, g = Lg.g, n = st.els.length;
  let svg = "", labs = "";
  const lab = (x, yy, html) => { labs += '<div class="lab" style="left:' + x.toFixed(1) + "px;top:" + yy.toFixed(1) + 'px">' + html + "</div>"; };
  const act = aria => (o.live ? ' tabindex="0" role="button" aria-label="' + esc(aria) + '"' : "");
  /* side paths first, so the main line draws over their risers */
  for (const q of Lg.P) {
    const p = q.p, ys = q.fb ? y + SUM_R : y - SUM_R, cls = "pth" + (fresh.has("p:" + p.id) ? " fresh" : "");
    const name = OB.toText(OB.displayGain(st, p.g));
    let body = "", pts = [[q.xt, y], [q.xt, q.y], [q.xs, q.y], [q.xs, ys]];
    if (q.unity) body = pl(pts);
    else {
      const dir = q.fb ? -1 : 1, bl = q.bx - q.bw / 2, br = q.bx + q.bw / 2;
      const inEdge = q.fb ? br : bl, outEdge = q.fb ? bl : br;
      body = pl([[q.xt, y], [q.xt, q.y], [inEdge, q.y]]) + arrow(inEdge, q.y, dir > 0 ? "r" : "l") +
        '<rect class="blk" x="' + bl + '" y="' + (q.y - q.bh / 2) + '" width="' + q.bw + '" height="' + q.bh + '" rx="3"/>' +
        pl([[outEdge, q.y], [q.xs, q.y], [q.xs, ys]]);
      lab(q.bx, q.y, mathOf(st, p.g));
    }
    body += arrow(q.xs, ys, q.fb ? "u" : "d");
    svg += '<g class="' + cls + '" data-p="' + p.id + '"' + act(t("pathAria", { g: name })) + ">" +
      '<polyline class="hit" points="' + pts.map(a => a.join(",")).join(" ") + '"/>' + body + "</g>";
  }
  /* main line */
  svg += '<text class="io" x="4" y="' + (y - 9) + '">' + esc(o.inp || "R") + "(s)</text>";
  for (let k = 0; k <= n; k++) {
    const x1 = k === 0 ? 4 : g.xs[k];
    svg += pl([[x1, y], [g.xe[k], y]]) + arrow(g.xe[k], y, "r");
  }
  svg += '<text class="io" x="' + (g.xe[n] + 6) + '" y="' + (y + 5) + '">' + esc(o.out || "C") + "(s)</text>";
  for (const q of Lg.P) svg += '<circle class="tap" cx="' + q.xt + '" cy="' + y + '" r="3.6"/>';
  st.els.forEach((e, k) => {
    if (e.t === "b") {
      const w = size["b:" + e.id].w, h = Lg.mainH, x = g.xe[k];
      svg += '<g class="mb' + (fresh.has("b:" + e.id) ? " fresh" : "") + '" data-b="' + e.id + '"' +
        act(t("blockAria", { g: OB.toText(OB.displayGain(st, e.g)) })) + '><rect class="blk" x="' + x + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="3"/></g>';
      lab(g.cx[k], y, mathOf(st, e.g));
    } else if (e.t === "x") {
      const cx = g.cx[k];
      svg += '<circle class="sum" cx="' + cx + '" cy="' + y + '" r="' + SUM_R + '"/>' + pl([[cx, y - 56], [cx, y - SUM_R]]) + arrow(cx, y - SUM_R, "d") +
        '<text class="io" x="' + (cx + 8) + '" y="' + (y - 44) + '">' + esc(e.name) + "(s)</text>" +
        '<text class="sgn" x="' + (cx - SUM_R - 11) + '" y="' + (y + 18) + '">+</text>' +
        '<text class="sgn" x="' + (cx - 17) + '" y="' + (y - SUM_R - 5) + '">+</text>';
    } else {
      const p = st.paths[e.p], cx = g.cx[k], q = Lg.P.find(z => z.id === e.p);
      const side = q.fb ? 1 : -1;
      svg += '<g class="sg" data-p="' + e.p + '" data-s="' + e.id + '"' +
        act(t("sumAria", { g: OB.toText(OB.displayGain(st, p.g)) })) + '><circle class="hitc" cx="' + cx + '" cy="' + y + '" r="19"/>' +
        '<circle class="sum" cx="' + cx + '" cy="' + y + '" r="' + SUM_R + '"/></g>' +
        '<text class="sgn" x="' + (cx - SUM_R - 11) + '" y="' + (side > 0 ? y - 8 : y + 18) + '">+</text>' +
        '<text class="sgn" x="' + (cx - 15) + '" y="' + (y + side * (SUM_R + 13) + 5) + '">' + signTxt(p.sg) + "</text>";
    }
  });
  return { html: '<svg class="dg" width="' + Lg.W + '" height="' + Lg.H + '" viewBox="0 0 ' + Lg.W + " " + Lg.H + '">' + svg + "</svg>" + labs, geo: Lg };
}

function fitMinis(root) {
  (root || document).querySelectorAll(".mini").forEach(m => {
    const inn = m.firstElementChild, W = +inn.dataset.w, H = +inn.dataset.h;
    const k = Math.min(1, Math.max(0.3, (m.clientWidth - 2) / W));

function fitOpts(root) {

    const opts = [...g.querySelectorAll(".opt")], over = o => o.scrollWidth > o.clientWidth + 1;
    opts.forEach(o => { const m = o.querySelector("math"); if (m) m.style.fontSize = ""; });

function fitDiagram() {
  if (!G.geo) return;

  const d = $("diagram"), s = $("dsizer");

/* the operands of a move, as [label key, expression, sign] */
function opsList(res) {
  const o = res.ops || {}, op = [];
  if (res.rule === "K2") op.push(["op_first", o.G1], ["op_second", o.G2]);
  else if (res.rule === "K3" && res.variant === "two") op.push(["op_path1", o.P, o.sp], ["op_path2", o.Q, o.sq]);
  else if (res.rule === "K3") op.push(res.variant === "unity" ? ["op_line", OB.N(1)] : ["op_block", o.G], ["op_branch", o.P, o.sg]);
  else if (res.rule === "K6") op.push(["op_fwd", o.G], ["op_fb", o.H, o.sg]);
  else if (res.kind === "split") op.push(["op_path", o.P, o.sp], ["op_crossed", o.Q, o.sq]);
  else if (res.rule !== "K1") op.push(["op_path", o.P], ["op_across", o.G]);
  return op;
}
function opsHtml(res, st) {
  return '<div class="q-ops">' + opsList(res).map(x => "<span>" + t(x[0]) + " <math><mrow>" + inner(mathOf(st, x[1])) + "</mrow></math>" +
    (x[2] !== undefined ? " · " + t("op_sign") + " <b>" + signTxt(x[2]) + "</b>" : "") + "</span>").join("") + "</div>";
}
function opsText(res, st) {
  return opsList(res).map(x => t(x[0]) + " " + OB.toText(OB.displayGain(st, x[1])) + (x[2] !== undefined ? " (" + signTxt(x[2]) + ")" : "")).join(", ");
}
/* what a move produced: the new gain (with its short name, if it got one) */
function resultOf(x) {
  if (x.res.kind === "none") return { html: esc(t("swappedNb")), text: t("swappedNb") };
  const al = x.next.aliases.length > x.st.aliases.length ? x.next.aliases.length : 0;
  const g = OB.displayGain(x.st, x.res.correct);
  return {
    html: "<math><mrow>" + (al ? "<msub><mi>A</mi><mn>" + al + "</mn></msub><mo>=</mo>" : "") + inner(OB.toMathML(g)) + "</mrow></math>",
    text: (al ? "A" + al + " = " : "") + OB.toText(g)
  };
}

/* ---------- solution replay: the notes' way or the shortest way, one step at a time ---------- */
function openSolution(src) {
  const L = G.L;
  if (!L.main) return;
  if (src === "deck" && !L.deck) src = "opt";
  const list = src === "deck" ? L.deck.map(d => ({ d: d })) : ((OB.solve(G.st0, L.allowed) || { plan: [] }).plan).map(a => ({ a: a }));
  const steps = [];
  let s = G.st0;
  for (const x of list) {
    const app = x.a || OB.deckApp(s, x.d);
    if (!app) break;
    const res = OB.analyze(s, app.rule, app.sel);
    if (!res.ok) break;
    const next = res.apply(res.correct || null);
    steps.push({ app: app, res: res, st: s, next: next, slide: x.d ? x.d[2] : 0, note: x.d ? x.d[3] || "" : "" });
    s = next;
  }
  stopReplay(); stopTimer();
  if (!G.done) G.hintUsed = true;
  G.q = null; G.sel = []; G.alt = null; G.altNote = ""; G.vote = null; G.msg = ""; G.msgCls = "";
  G.replay = { src: src, steps: steps, states: [G.st0].concat(steps.map(x => x.next)), k: 0, iv: 0, fresh: new Set(), res: steps.length ? steps[0].res : null };
  renderPlay();
}
function setReplay(k) {
  const R = G.replay;
  if (!R) return;
  const n = R.steps.length;
  k = Math.max(0, Math.min(n, k));
  R.fresh = k === R.k + 1 ? freshIds(R.states[k - 1], R.states[k]) : new Set();
  R.k = k; R.res = k < n ? R.steps[k].res : null;
  if (k === n) stopAuto();
  renderDiagram(); renderLegend(); renderDock();
}
function stopAuto() { if (G.replay && G.replay.iv) { clearInterval(G.replay.iv); G.replay.iv = 0; } }
function toggleAuto() {
  const R = G.replay;
  if (!R) return;
  if (R.iv) stopAuto();
  else {
    if (R.k >= R.steps.length) setReplay(0);
    R.iv = setInterval(() => { if (G.replay) setReplay(G.replay.k + 1); }, 1800);
  }
  renderDock();
}
function stopReplay() { stopAuto(); G.replay = null; }
function closeReplay() { stopReplay(); G.msg = ""; renderPlay(); }

/* ---------- step response chart ---------- */
function ticks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(Math.abs(v) < 1e-12 ? 0 : v);
  return out;
}
const fmt = v => String(Number(v.toPrecision(3)));
function drawChart() {
  const box = $("chart"), note = $("chart-note");
  if (!G.base) { box.innerHTML = ""; note.textContent = ""; return; }
  const W = 320, H = 196, m = { l: 36, r: 10, t: 10, b: 32 }, tEnd = G.rm.tEnd, base = G.base;
  let lo = Math.min(0, ...base.y), hi = Math.max(...base.y);
  const span = (hi - lo) || 1;
  let altY = null;
  if (G.alt) {
    altY = G.alt.y.map(v => Math.max(lo - span, Math.min(hi + span, v)));
    lo = Math.min(lo, ...altY); hi = Math.max(hi, ...altY);
  }
  hi += 0.06 * ((hi - lo) || 1);
  const yt = ticks(lo, hi, 4), xt = ticks(0, tEnd, 5);
  lo = Math.min(lo, yt[0]); hi = Math.max(hi, yt[yt.length - 1]);
  const sx = v => m.l + (W - m.l - m.r) * v / tEnd, sy = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  const path = (ts, ys) => ys.map((v, i) => (i ? "L" : "M") + sx(ts[i]).toFixed(1) + " " + sy(v).toFixed(1)).join("");
  let s = "";
  for (const v of yt) s += '<line class="gl" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + sy(v) + '" y2="' + sy(v) + '"/><text class="tk" x="' + (m.l - 5) + '" y="' + (sy(v) + 3.5) + '" text-anchor="end">' + fmt(v) + "</text>";
  for (const v of xt) s += '<text class="tk" x="' + sx(v) + '" y="' + (H - m.b + 14) + '" text-anchor="middle">' + fmt(v) + "</text>";
  s += '<line class="ax" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + sy(0) + '" y2="' + sy(0) + '"/>';
  s += '<text class="tk" x="' + ((m.l + W - m.r) / 2) + '" y="' + (H - 2) + '" text-anchor="middle">t (s)</text>';
  if (altY) s += '<path class="alt" d="' + path(G.alt.t, altY) + '"/>';
  s += '<path class="base" d="' + path(base.t, base.y) + '"/>';
  s += '<line class="xh" id="xh" y1="' + m.t + '" y2="' + (H - m.b) + '" visibility="hidden"/><circle class="dot-b" id="dot-b" r="4" visibility="hidden"/><circle class="dot-a" id="dot-a" r="4" visibility="hidden"/>';
  const yEnd = base.y[base.y.length - 1];
  box.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("chartAria", { y: fmt(yEnd) })) + '">' + s + "</svg>" +
    (altY ? '<div class="chart-lg"><span><svg viewBox="0 0 22 8"><line class="sw-b" x1="0" x2="22" y1="4" y2="4"/></svg>' + crText() + ", " + t("lgBase") +
      '</span><span><svg viewBox="0 0 22 8"><line class="sw-a" x1="0" x2="22" y1="4" y2="4"/></svg>' + t("lgAlt") + "</span></div>" : "") +
    '<div class="tip" id="tip" hidden></div>';
  note.textContent = (G.altNote ? G.altNote + " " : "") + (G.L.numeric ? t("chartNum") : t("chartSym"));
  const svg = box.querySelector("svg");
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), k = r.width / W;
    const x = (ev.clientX - r.left) / k;
    const tt = Math.max(0, Math.min(tEnd, (x - m.l) / (W - m.l - m.r) * tEnd));
    const i = Math.round(tt / tEnd * (base.t.length - 1));
    const xh = $("xh"), db = $("dot-b"), da = $("dot-a"), tip = $("tip");
    const X = sx(base.t[i]);
    xh.setAttribute("x1", X); xh.setAttribute("x2", X); xh.setAttribute("visibility", "visible");
    db.setAttribute("cx", X); db.setAttribute("cy", sy(base.y[i])); db.setAttribute("visibility", "visible");
    let txt = "t = " + fmt(base.t[i]) + " s<br>" + crText() + " = " + base.y[i].toFixed(3);
    if (altY && i < altY.length) {
      da.setAttribute("cx", X); da.setAttribute("cy", sy(altY[i])); da.setAttribute("visibility", "visible");
      txt += "<br>" + t("lgAlt") + " = " + (Math.abs(G.alt.y[i]) < 1e4 ? G.alt.y[i].toFixed(3) : G.alt.y[i].toExponential(1));
    } else da.setAttribute("visibility", "hidden");
    tip.innerHTML = txt; tip.hidden = false;
    const px = X * k, left = px > r.width / 2 ? px - tip.offsetWidth - 10 : px + 10;
    tip.style.left = left + "px"; tip.style.top = "4px";
  });
  svg.addEventListener("pointerleave", () => {
    ["xh", "dot-b", "dot-a"].forEach(id => $(id).setAttribute("visibility", "hidden"));
    $("tip").hidden = true;
  });
}

/* ---------- random practice: #Pe-123 opens the same diagram again ----------
   e/m/h: reduction only; i: two inputs (reduce with N = 0, then questions on N and superposition);
   n: numeric (reduce, then the characteristic equation, the poles and the final value);
   r: which rules apply right now (no reduction). */
const PRACTICE_TYPES = ["e", "m", "h", "i", "n", "r"];
const newSeed = () => 1 + Math.floor(Math.random() * 99999);
const numExpr = v => OB.N(Math.round(v * 1e9) / 1e9);
function genQ(q, m) {
  const both = k => ({ tr: TXT.tr[k], en: TXT.en[k] });
  return {
    q: both("pq_" + q.kind), why: both("pw_" + q.kind), m: q.m || m, eq0: !!q.eq0,
    opts: q.opts.map(o => ({ x: o.p ? OB.polyExpr(o.p) : o.v !== undefined ? numExpr(o.v) : o.x, z: o.z, ok: !!o.ok, fb: o.ok ? null : both("pf_" + o.tag) }))
  };
}
function decoratePractice(lv, type, id) {
  const dn = l => TXT[l]["diff_" + type].toLocaleLowerCase(l);
  const task = l => TXT[l]["practiceTask" + (type === "i" || type === "n" ? "_" + type : "")];
  Object.assign(lv, {
    id: id, practice: type, ch: 0, allowed: lv.allowed || OB.RULES.slice(),
    title: { tr: TXT.tr.practiceTitle.replace("{d}", dn("tr")), en: TXT.en.practiceTitle.replace("{d}", dn("en")) },
    intro: { tr: task("tr"), en: task("en") }
  });
  if (type === "i") {
    const td = OB.twoInputData(lv);
    lv.post = td.questions.map(q => genQ(q));
    lv.extra = [["C_N/N", td.cn], ["C", td.total]];
  } else if (type === "n") {
    const nd = OB.numericData(lv), T = OB.ratToExpr(nd.T);
    lv.post = nd.questions.map(q => genQ(q, [["C/R", T]]));
    lv.extra = [["c(∞)", numExpr(nd.final)]];
  }
  return lv;
}
function startPractice(h) {
  const d = h[1], lv = OB.practiceLevel(d, +h.slice(3));
  if (!lv) return false;
  startLevel(h, decoratePractice(lv, d, h));
  return true;
}

/* ---------- which rules apply right now? ---------- */
const RQ = { right: 0, n: 0 };
function startRuleQuiz(h) {
  const d = OB.ruleQuiz(+h.slice(3));
  if (!d) return false;
  startLevel(h, { id: h, practice: "r", ch: 0, rqData: d, title: { tr: TXT.tr.rqTitle, en: TXT.en.rqTitle }, intro: { tr: TXT.tr.rqTask, en: TXT.en.rqTask } });
  return true;
}
const rqApplies = () => OB.QUIZ_RULES.filter(r => G.L.rqData.apps[r].length);
function rqToggle(k) {
  const s = G.rqs;
  if (!s || s.checked) return;
  if (k === "none") { const on = s.picked.has("none"); s.picked.clear(); if (!on) s.picked.add("none"); }
  else { s.picked.delete("none"); if (s.picked.has(k)) s.picked.delete(k); else s.picked.add(k); }
  renderDock();
}
function rqCheck() {
  const s = G.rqs;
  if (!s || s.checked || !s.picked.size) return;
  const ok = rqApplies(), want = new Set(ok.length ? ok : ["none"]);
  s.right = want.size === s.picked.size && [...want].every(x => s.picked.has(x));
  s.checked = true; RQ.n++;
  if (s.right) RQ.right++; else G.mistakes++;
  renderStats(); renderDock();
}
function rqShow(r, k) {
  const a = G.L.rqData.apps[r][k];
  if (!a) return;
  G.rqs.show = r + ":" + k;
  G.sel = (a.sel.blocks || []).map(id => ({ k: "b", id: id })).concat((a.sel.paths || []).map(id => ({ k: "p", id: id })));
  renderDock(); updateMarks();
}
function appLabel(st, r, a) {
  const gains = r === "K2" ? a.sel.blocks.map(id => st.els.find(e => e.id === id).g) : a.sel.paths.map(p => st.paths[p].g);
  return gains.map(g => "<math><mrow>" + inner(mathOf(st, g)) + "</mrow></math>").join('<span class="sep">' + (r === "K2" ? "→" : "+") + "</span>");
}
function rqHtml() {
  const s = G.rqs, d = G.L.rqData, ok = new Set(rqApplies()), none = !ok.size;
  let h = '<div class="q-head"><span class="q-rule">' + esc(t("rqTitle")) + '</span><span class="rq-score">' + t("rqScore", { r: RQ.right, n: RQ.n }) + "</span></div>" +
    '<p class="q-prompt">' + t("rqQ") + '</p><div class="cards rq-cards">';
  const mark = (on, right) => (s.checked ? (right ? " ok" : on ? " bad" : "") : "");
  for (const r of OB.QUIZ_RULES) {
    const on = s.picked.has(r);
    h += '<button type="button" class="rcard rq' + (on ? " on" : "") + mark(on, ok.has(r)) + '" data-rq="' + r + '" aria-pressed="' + on + '">' + icon(r) +
      '<span class="rn">' + t("rule") + " " + ruleNo(r) + '</span><span class="rt">' + RULE_NAME[prefs.lang][r] + "</span></button>";
  }
  const onN = s.picked.has("none");
  h += '<button type="button" class="rcard rq rq-none' + (onN ? " on" : "") + mark(onN, none) + '" data-rq="none" aria-pressed="' + onN + '"><span class="rt">' + t("rqNone") + "</span></button></div>";
  if (!s.checked) return h + '<div class="row"><button type="button" class="btn primary" id="rq-check"' + (s.picked.size ? "" : " disabled") + ">" + t("rqCheck") + "</button></div>";
  h += '<p class="q-fb ' + (s.right ? "good" : "warn") + '">' + (s.right ? t(none ? "rqNoneRight" : "rqRight") : t("rqWrong")) + "</p>";
  if (!none) {
    h += '<div class="rq-where"><b>' + t("rqWhere") + "</b><ul>" + OB.QUIZ_RULES.map(r => "<li><span class=\"rq-rule\">" + esc(ruleLabel(r)) + "</span>" +
      (d.apps[r].length ? d.apps[r].map((a, i) => '<button type="button" class="rq-app' + (s.show === r + ":" + i ? " on" : "") + '" data-r="' + r + '" data-k="' + i + '">' + appLabel(G.st, r, a) + "</button>").join("")
        : "<i>" + t("rqNo") + "</i>") + "</li>").join("") + '</ul><p class="hint-ex">' + t("rqShowHint") + "</p></div>";
  }
  return h + '<div class="row"><button type="button" class="btn primary" id="rq-next">' + t("rqNext") + "</button></div>";
}

/* ---------- homework: every student number gets its own diagrams ----------
   #K[-SET-types[-g]]  the instructor's page (student link and answer key)
   #O-SET-types[-g]    the students' page; -g lets them solve the diagrams in the game too
   #H-SET-types-no-k   diagram k of a student, in the game */
let hwNo = "";
try { hwNo = sessionStorage.getItem("me3001-oneblock-hw") || ""; } catch (e) { /* storage blocked */ }
const typeName = ty => t("diff_" + ty);
const hwTask = ty => t("hwTask_" + (ty === "n" || ty === "i" ? ty : "s"));
function hwLevel(set, types, no, k) {
  const type = types[k - 1], lv = OB.practiceLevel(type, OB.hwSeed(set, no, k, type));
  return lv ? { type: type, lv: lv } : null;
}
function hwFigure(type, lv) {
  return miniHtml(type === "i" ? OB.parseFig(lv.fig) : OB.parseLevel(lv), { inp: "R", out: "C" });
}
function startHomework(h) {
  const m = /^H-([A-Za-z0-9]{1,16})-([emhni]{1,8})-([A-Za-z0-9]{3,15})-(\d)$/.exec(h);
  if (!m) return false;
  const set = m[1].toUpperCase(), types = m[2], no = m[3], k = +m[4];
  if (k < 1 || k > types.length) return false;
  const r = hwLevel(set, types, no, k);
  if (!r) return false;
  const lv = decoratePractice(r.lv, r.type, h);
  lv.hw = { set: set, types: types, no: no, k: k, n: types.length };
  const head = l => TXT[l].hwTitle + " " + set + " · " + k + "/" + types.length;
  lv.title = { tr: head("tr"), en: head("en") };
  lv.intro = { tr: TXT.tr["hwTask_" + (r.type === "n" || r.type === "i" ? r.type : "s")], en: TXT.en["hwTask_" + (r.type === "n" || r.type === "i" ? r.type : "s")] };
  startLevel(h, lv);
  return true;
}
const hwVars = L => ({ set: L.hw.set, no: L.hw.no, k: L.hw.k, n: L.hw.n });
function renderHw(h) {
  const m = /^O-([A-Za-z0-9]{1,16})-([emhni]{1,8})(-g)?$/.exec(h);
  G.hwCtx = { set: m[1].toUpperCase(), types: m[2], game: !!m[3] };
  $("hw").innerHTML = '<h2 class="hw-h">' + esc(t("hwTitle") + " " + G.hwCtx.set) + '</h2><p class="map-intro">' + rich(t("hwIntro")) + "</p>" +
    '<form class="hw-form no-print" id="hw-form"><label for="hw-no">' + t("hwNo") + '</label><input id="hw-no" autocomplete="off" maxlength="15" value="' + esc(hwNo) + '">' +
    '<button type="submit" class="btn primary">' + t("hwShow") + '</button><span class="hw-msg" id="hw-msg" aria-live="polite"></span></form><div id="hw-list"></div>';
  if (hwNo) showHwList();
}
function showHwList() {
  const c = G.hwCtx, n = c.types.length;
  let x = '<div class="row hw-bar"><b>' + esc(c.set + " · " + hwNo) + '</b><button type="button" class="btn no-print" id="hw-print">' + t("print") + "</button></div>";
  for (let k = 1; k <= n; k++) {
    const r = hwLevel(c.set, c.types, hwNo, k);
    x += '<article class="card hw-item"><h3>' + k + ". " + esc(typeName(r.type)) + "</h3><p>" + rich(hwTask(r.type)) + "</p>" + hwFigure(r.type, r.lv) +
      '<p class="hw-code">' + t("hwCode") + ": " + esc(c.set + "-" + hwNo + "-" + k) + "</p>" +
      (c.game ? '<div class="row no-print"><button type="button" class="btn" data-hwk="' + k + '">' + t("hwPlay") + "</button></div>" : "") + "</article>";
  }
  $("hw-list").innerHTML = x;

}
function submitHw() {
  const v = $("hw-no").value.trim();
  if (!/^[A-Za-z0-9]{3,15}$/.test(v)) { $("hw-msg").textContent = t("hwBadNo"); return; }
  hwNo = v;
  try { sessionStorage.setItem("me3001-oneblock-hw", v); } catch (e) { /* storage blocked */ }
  $("hw-msg").textContent = "";
  showHwList();
}
function renderKey(h) {
  const m = /^K-([A-Za-z0-9]{1,16})-([emhni]{1,8})(-g)?$/.exec(h) || [];
  $("hw").innerHTML = '<h2 class="hw-h">' + t("hwHead") + '</h2><p class="map-intro">' + t("keyIntro") + "</p>" +
    '<form class="key-form no-print" id="key-form">' +
    '<label for="key-set">' + t("keySet") + '</label><input id="key-set" maxlength="16" autocomplete="off" value="' + esc(m[1] || "ODEV1") + '">' +
    '<label for="key-types">' + t("keyTypes") + '</label><div><input id="key-types" maxlength="8" autocomplete="off" value="' + esc(m[2] || "mhn") + '"><small>' + t("keyTypesHelp") + "</small></div>" +
    '<label class="chk"><input type="checkbox" id="key-game"' + (m[3] ? " checked" : "") + "><span>" + t("keyGame") + "</span></label>" +
    '<label for="key-nos">' + t("keyNos") + '</label><textarea id="key-nos" rows="5" spellcheck="false"></textarea>' +
    '<div class="row"><button type="submit" class="btn primary">' + t("keyMake") + '</button><span class="hw-msg" id="key-msg" aria-live="polite"></span></div></form>' +
    '<p class="note no-print">' + t("keyWarn") + '</p><div id="key-out"></div>';
}
function fmtNum(v) { const r = Math.round(v * 100) / 100; return (r < 0 ? "−" : "") + String(Math.abs(r)); }
function polesList(z) {
  const out = [];
  for (const c of z.slice().sort((a, b) => b.re - a.re || b.im - a.im)) {
    if (Math.abs(c.im) < 1e-7) out.push([fmtNum(c.re)]);
    else if (c.im > 0) out.push([fmtNum(c.re), fmtNum(c.im).replace("−", "")]);
  }
  return out;
}
function polesMath(z) {
  return "<math><mrow><mi>s</mi><mo>=</mo>" + polesList(z).map(p => "<mn>" + p[0] + "</mn>" + (p[1] ? "<mo>±</mo><mn>" + p[1] + "</mn><mi>j</mi>" : "")).join("<mo>,</mo>") + "</mrow></math>";
}
const polesText = z => polesList(z).map(p => p[0] + (p[1] ? " ± " + p[1] + "j" : "")).join(", ");
const eqLine = (lhs, e, eq0) => '<div class="k-line"><math><mrow>' + (lhs ? lhsMath(lhs) + "<mo>=</mo>" : "") + inner(OB.toMathML(e)) + (eq0 ? "<mo>=</mo><mn>0</mn>" : "") + "</mrow></math></div>";
function makeKey() {
  const set = $("key-set").value.trim().toUpperCase(), types = $("key-types").value.trim().toLowerCase(), game = $("key-game").checked;
  if (!/^[A-Z0-9]{1,16}$/.test(set) || !/^[emhni]{1,8}$/.test(types)) { $("key-msg").textContent = t("keyBad"); return; }
  $("key-msg").textContent = "";
  const nos = Array.from(new Set($("key-nos").value.split(/[\s,;]+/).map(x => x.trim()).filter(x => /^[A-Za-z0-9]{3,15}$/.test(x))));
  const tail = set + "-" + types + (game ? "-g" : ""), link = PUBLIC_URL + "#O-" + tail;
  let x = '<section class="card key-link"><h3>' + t("keyLink") + '</h3><p><code id="key-url">' + esc(link) + "</code></p>" +
    '<div class="row no-print"><button type="button" class="btn" id="key-copy-link">' + t("copy") + '</button><span class="hw-msg" id="key-link-msg" aria-live="polite"></span></div>' +
    '<div class="key-qr" id="key-qr"></div><p class="hint-ex">' + t("keyLinkNote") + "</p></section>";
  if (nos.length) {
    const tsv = [["No", "#", t("keyType"), "C/R", "C_N/N", "C", t("keyChar"), t("keyPoles"), t("keyFinal"), t("keyPar")].join("\t")];
    let rows = "";
    for (const no of nos) for (let k = 1; k <= types.length; k++) {
      const r = hwLevel(set, types, no, k), a = OB.answerKey(r.type, r.lv);
      let ans = eqLine("C/R", a.cr);
      if (a.cn) ans += eqLine("C_N/N", a.cn) + eqLine("C", a.total);
      if (a.char) ans += '<div class="k-lbl">' + t("keyChar") + "</div>" + eqLine("", a.char, true);
      if (a.poles) ans += '<div class="k-line">' + polesMath(a.poles) + "</div>" + eqLine("c(∞)", numExpr(a.final));
      ans += '<div class="k-lbl">' + t("keyPar") + ": " + a.par + "</div>";
      rows += "<tr>" + (k === 1 ? '<td class="k-no" rowspan="' + types.length + '">' + esc(no) + "</td>" : "") + "<td>" + k + "</td><td>" + esc(typeName(r.type)) + "</td>" +
        '<td class="k-fig">' + hwFigure(r.type, r.lv) + '</td><td class="k-ans">' + ans + "</td></tr>";
      tsv.push([no, k, typeName(r.type), OB.toText(a.cr), a.cn ? OB.toText(a.cn) : "", a.total ? OB.toText(a.total) : "", a.char ? OB.toText(a.char) + " = 0" : "",
        a.poles ? polesText(a.poles) : "", a.poles ? OB.toText(numExpr(a.final)) : "", a.par].join("\t"));
    }
    x += '<section class="card key-tab"><div class="row"><h3>' + t("keyTable") + " · " + esc(set) + '</h3><button type="button" class="btn no-print" id="key-print">' + t("print") + "</button>" +
      '<button type="button" class="btn no-print" id="key-copy">' + t("keyCopy") + '</button><span class="hw-msg" id="key-tab-msg" aria-live="polite"></span></div>' +
      '<div class="key-scroll"><table class="key-table"><thead><tr><th>No</th><th>#</th><th>' + t("keyType") + "</th><th>" + t("keyDiagram") + "</th><th>" + t("keyAnswers") + "</th></tr></thead><tbody>" +
      rows + '</tbody></table></div><textarea class="nb-text no-print" id="key-text" readonly rows="4" aria-label="' + esc(t("keyTable")) + '">' + esc(tsv.join("\n")) + "</textarea></section>";
  }
  $("key-out").innerHTML = x;
  fitMinis($("key-out"));
  withQr(() => { const q = $("key-qr"); if (q) q.innerHTML = qrSvg(link); });
  try { history.replaceState(null, "", "#K-" + tail); } catch (e) { /* sandboxed */ }
}
function copyText(text, msg) {
  const say = ok => { if (msg) msg.textContent = ok ? t("copied") : t("copyFail"); };
  const fallback = () => {
    try { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); say(document.execCommand("copy")); ta.remove(); } catch (e) { say(false); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => say(true), fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function printPage(cls) {
  document.body.classList.add(cls);
  try { window.print(); } catch (e) { /* printing blocked */ }
  setTimeout(() => document.body.classList.remove(cls), 800);
}

/* ---------- class mode and the QR code of the level ---------- */
const PUBLIC_URL = "https://mycoskun.github.io/teaching-labs/me3001/l04-one-block/";
const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
let qrState = 0;
const qrWait = [];
function withQr(cb) {
  if (window.qrcode) { cb(); return; }
  qrWait.push(cb);
  if (qrState) return;
  qrState = 1;
  const sc = document.createElement("script");
  sc.src = QR_LIB; sc.async = true;
  sc.onload = () => { qrState = 2; qrWait.splice(0).forEach(f => f()); };
  sc.onerror = () => { qrState = 3; qrWait.length = 0; };
  document.head.appendChild(sc);
}
function qrSvg(text) {
  const q = window.qrcode(0, "M");
  q.addData(text); q.make();
  const n = q.getModuleCount();
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
  return '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) +
    '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
const levelUrl = () => PUBLIC_URL + "#" + (G.L.practice ? G.L.id : "L" + G.L.id);
function updateQR() {
  const box = $("qr");
  if (!prefs.proj || !G.L) { box.hidden = true; box.classList.remove("big"); return; }
  withQr(() => {
    if (!prefs.proj || !G.L) return;
    const u = levelUrl();
    box.innerHTML = '<button type="button" class="qr-btn" id="qr-btn" aria-label="' + esc(t("qrBig")) + '" title="' + esc(u) + '">' + qrSvg(u) + "</button>" +
      '<span class="qr-cap">' + esc(t("qrCap")) + "</span>";
    box.dataset.url = u;
    box.hidden = false;
  });
}
function applyProj() {
  document.body.classList.toggle("proj", !!prefs.proj);
  $("go-class").setAttribute("aria-pressed", String(!!prefs.proj));
}

/* ---------- language, routing, events ---------- */
function applyLang() {
  document.documentElement.lang = prefs.lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t, { n: LEVELS.length }); });
  $("lang-tr").setAttribute("aria-pressed", prefs.lang === "tr");
  $("lang-en").setAttribute("aria-pressed", prefs.lang === "en");
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let view = "levels";
  if (h === "rules") view = "rules";
  else if (/^L\d-\d+$/.test(h) && levelIndex(h.slice(1)) >= 0) view = "play";
  else if (/^P[emhinr]-\d+$/.test(h) || HOMEWORK && /^H-[A-Za-z0-9]{1,16}-[emhni]{1,8}-[A-Za-z0-9]{3,15}-\d$/.test(h)) view = "play";
  else if (HOMEWORK && /^K(-[A-Za-z0-9]{1,16}-[emhni]{1,8}(-g)?)?$/.test(h)) view = "key";
  else if (HOMEWORK && /^O-[A-Za-z0-9]{1,16}-[emhni]{1,8}(-g)?$/.test(h)) view = "hw";
  if (view !== "play") { stopReplay(); stopTimer(); }
  $("view-levels").hidden = view !== "levels";
  $("view-rules").hidden = view !== "rules";
  $("view-play").hidden = view !== "play";
  $("view-hw").hidden = view !== "key" && view !== "hw";
  $("go-levels").setAttribute("aria-current", view === "levels" ? "page" : "false");
  $("go-rules").setAttribute("aria-current", view === "rules" ? "page" : "false");
  if (view === "levels") renderMap();
  else if (view === "rules") renderRules();
  else if (view === "key") renderKey(h);
  else if (view === "hw") renderHw(h);
  else if (h[0] === "P" || h[0] === "H") {
    if (G.L && G.L.id === h) renderPlay();
    else if (!(h[0] === "H" ? startHomework(h) : h[1] === "r" ? startRuleQuiz(h) : startPractice(h))) { go("#levels"); return; }
  } else {
    const id = h.slice(1);
    if (!G.L || G.L.id !== id) startLevel(id); else renderPlay();
  }
  window.scrollTo(0, 0);
}
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
const restart = () => startLevel(G.L.id, G.L.practice ? G.L : null);

function setLang(l) {
  prefs.lang = l; savePrefs(); applyLang();
  if (!$("view-play").hidden && G.L) { G.msg = ""; renderPlay(); }
  else if (!$("view-rules").hidden) renderRules();
  else if (!$("view-hw").hidden) route();
  else renderMap();
}
$("lang-tr").addEventListener("click", () => setLang("tr"));
$("lang-en").addEventListener("click", () => setLang("en"));
$("go-levels").addEventListener("click", () => go("#levels"));
$("go-rules").addEventListener("click", () => go("#rules"));
$("go-class").addEventListener("click", () => {
  prefs.proj = !prefs.proj; savePrefs(); applyProj();
  if (!$("view-play").hidden && G.L) renderPlay();
});
$("chapters").addEventListener("click", ev => {
  const b = ev.target.closest(".tile");
  if (!b) return;
  if (b.dataset.go) go(b.dataset.go);
  else if (b.dataset.diff) go("#P" + b.dataset.diff + "-" + newSeed()); else go("#L" + b.dataset.id);
});
$("btn-undo").addEventListener("click", undo);
$("btn-reset").addEventListener("click", restart);
$("btn-hint").addEventListener("click", hint);
$("btn-solve").addEventListener("click", () => openSolution(G.L.deck ? "deck" : "opt"));
$("ans-mode").addEventListener("change", ev => { prefs.mode = ev.target.value; savePrefs(); if (G.q) { G.q.forceMcq = false; renderDock(); } });
$("qr").addEventListener("click", ev => { if (ev.target.closest(".qr-btn")) $("qr").classList.toggle("big"); });
function pickFromDiagram(ev) {
  const el = ev.target.closest("[data-b],[data-p]");
  if (!el) return false;
  if (el.dataset.b) toggleSel("b", el.dataset.b); else toggleSel("p", el.dataset.p);
  return true;
}
$("diagram").addEventListener("click", pickFromDiagram);
$("diagram").addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && pickFromDiagram(ev)) ev.preventDefault(); });
$("dock").addEventListener("click", ev => {
  const rq = ev.target.closest("[data-rq]"); if (rq) { rqToggle(rq.dataset.rq); return; }
  const ra = ev.target.closest(".rq-app"); if (ra) { rqShow(ra.dataset.r, +ra.dataset.k); return; }
  const c = ev.target.closest(".rcard"); if (c && !c.disabled) { onRule(c.dataset.r); return; }
  const o = ev.target.closest(".opt");
  if (o) { if (o.dataset.qo !== undefined) pickQuiz(+o.dataset.qo); else pickOption(+o.dataset.i); return; }
  const k = ev.target.closest(".keypad button"); if (k) { keypad(k.dataset.k); return; }
  const tb = ev.target.closest(".tb"); if (tb) { tallyVote(+tb.dataset.v, +tb.dataset.d); return; }
  const src = ev.target.closest(".sol-src button"); if (src) { openSolution(src.dataset.src); return; }
  const id = ev.target.closest("button") && ev.target.closest("button").id;
  if (id === "q-cancel") closeQ();
  else if (id === "ans-check") checkTyped();
  else if (id === "show-opts") { G.q.forceMcq = true; renderDock(); }
  else if (id === "go-next") go("#L" + LEVELS[levelIndex(G.L.id) + 1].id);
  else if (id === "go-new") go("#P" + G.L.practice + "-" + newSeed());
  else if (id === "go-hw") go("#O-" + G.L.hw.set + "-" + G.L.hw.types + "-g");
  else if (id === "rq-check") rqCheck();
  else if (id === "rq-next") go("#Pr-" + newSeed());
  else if (id === "go-replay") restart();
  else if (id === "go-map") go("#levels");
  else if (id === "v-start") { if (T.run) stopTimer(); else startTimer(); tick(); }
  else if (id === "v-reveal") revealVote();
  else if (id === "v-again") voteAgain();
  else if (id === "v-go") voteGo();
  else if (id === "quiz-next") quizNext();
  else if (id === "sol-close") closeReplay();
  else if (id === "sol-prev") setReplay(G.replay.k - 1);
  else if (id === "sol-next") setReplay(G.replay.k + 1);
  else if (id === "sol-auto") toggleAuto();
  else if (id === "sol-deck") openSolution("deck");
  else if (id === "sol-opt") openSolution("opt");
  else if (id === "nb-copy") copyNotebook();
  else if (id === "nb-print") printNotebook();
});
$("hw").addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "hw-form") submitHw(); else if (ev.target.id === "key-form") makeKey();
});
$("hw").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.hwk) go("#H-" + G.hwCtx.set + "-" + G.hwCtx.types + "-" + hwNo + "-" + b.dataset.hwk);
  else if (b.id === "hw-print") printPage("print-hw");
  else if (b.id === "key-print") printPage("print-hw");
  else if (b.id === "key-copy-link") copyText($("key-url").textContent, $("key-link-msg"));
  else if (b.id === "key-copy") copyText($("key-text").value, $("key-tab-msg"));
});
$("dock").addEventListener("change", ev => { if (ev.target.id === "v-dur") { prefs.voteDur = +ev.target.value; savePrefs(); if (!T.run) { T.left = null; T.up = false; tick(); } } });
$("dock").addEventListener("input", ev => { if (ev.target.id === "ans-in" && G.q) { G.q.text = ev.target.value; preview(); } });
$("dock").addEventListener("keydown", ev => { if (ev.target.id === "ans-in" && ev.key === "Enter") { ev.preventDefault(); checkTyped(); } });

/* keyboard: 1–9 and 0 pick a rule card, A–D an option, Z undo, H hint, Esc cancel; arrows step a solution */
document.addEventListener("keydown", ev => {
  if ($("view-play").hidden || !G.L) return;
  const tag = (ev.target.tagName || "").toLowerCase();
  if (ev.key === "Escape") {
    if ($("qr").classList.contains("big")) $("qr").classList.remove("big");
    else if (G.replay) closeReplay();
    else if (G.q) closeQ();
    return;
  }
  if (tag === "input" || tag === "textarea" || tag === "select" || ev.altKey || ev.metaKey) return;
  const k = ev.key;
  if (ev.ctrlKey) { if (k === "z" || k === "Z") { ev.preventDefault(); undo(); } return; }
  if (G.replay) {
    if (k === "ArrowRight") { ev.preventDefault(); setReplay(G.replay.k + 1); }
    else if (k === "ArrowLeft") { ev.preventDefault(); setReplay(G.replay.k - 1); }
    return;
  }
  if (G.stage === "rq") {
    if (/^[1236]$/.test(k)) { ev.preventDefault(); rqToggle("K" + k); }
    else if (k === "0") { ev.preventDefault(); rqToggle("none"); }
    return;
  }
  if (/^[0-9]$/.test(k)) {
    const c = document.querySelector('#dock .rcard[data-r="K' + (k === "0" ? 10 : k) + '"]');
    if (c && !c.disabled) { ev.preventDefault(); onRule(c.dataset.r); }
    return;
  }
  const li = "abcd".indexOf(k.toLowerCase());
  if (li >= 0 && k.length === 1) {
    const b = document.querySelectorAll("#dock .q-opts .opt")[li];
    if (b && !b.disabled) { ev.preventDefault(); b.click(); }
    return;
  }
  if (k === "z" || k === "Z") undo();
  else if (k === "h" || k === "H") hint();
});
let rz = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { fitDiagram(); fitMinis(); fitOpts(); }); });
window.addEventListener("hashchange", route);
window.addEventListener("afterprint", () => document.body.classList.remove("print-nb", "print-hw"));

if (/[?&]debug\b/.test(location.search)) { window.__G = G; window.__T = T; window.__TXT = TXT; window.__HW = HOMEWORK; } /* browser tests read the game state */
if (HOMEWORK) document.querySelector('[data-t="mapIntro"]').dataset.t = "mapIntroHw";
applyLang();
applyProj();
route();
/* MathML sizes change once the web fonts arrive; lay the diagrams out again */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G.L && !$("view-play").hidden) { renderDiagram(); if (G.stage !== "play" || G.fig) renderPlay(); } });
})();

</script>
</body>
